<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeonLift | Redline Protocol</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;800&display=swap');

        :root {
            --bg-color: #050505; --surface: #0f0f0f; --primary: #ff1a1a; --secondary: #660000;
            --border: rgba(255, 26, 26, 0.3); --shadow: 0 0 20px rgba(255, 26, 26, 0.2);
            --text-main: #ffffff; --text-muted: #666666; --map-cold: #1a1a1a;
            --font-tactical: 'Orbitron', sans-serif;
            --font-data: 'JetBrains Mono', 'Courier New', monospace;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: var(--font-tactical); background-color: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .screen { flex: 1; padding: 20px; overflow-y: auto; display: none; padding-bottom: 110px; contain: content; }
        .screen.active { display: block; animation: terminalBoot 0.4s ease-out; }

        @keyframes terminalBoot {
            0% { opacity: 0; transform: translateY(10px); filter: brightness(2) blur(5px); }
            100% { opacity: 1; transform: translateY(0); filter: brightness(1) blur(0px); }
        }

        h1 { font-family: var(--font-tactical); font-size: 24px; font-weight: 900; color: var(--primary); text-transform: uppercase; margin: 0; letter-spacing: 4px; text-shadow: 0 0 15px var(--primary); }
        h2 { font-family: var(--font-tactical); font-size: 11px; color: var(--text-muted); margin: 25px 0 10px 0; font-weight: 800; text-transform: uppercase; letter-spacing: 5px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 20px; margin-bottom: 15px; position: relative; box-shadow: var(--shadow); transition: var(--transition); }
        .card::after { content: ""; position: absolute; top: -1px; left: -1px; width: 15px; height: 15px; border-top: 3px solid var(--primary); border-left: 3px solid var(--primary); }
        
        .btn { font-family: var(--font-tactical); background: var(--primary); color: #000; border: none; padding: 18px; font-weight: 900; font-size: 14px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; text-transform: uppercase; clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0% 30%); transition: 0.1s; }
        .btn:active { background: #fff; transform: scale(0.96); }
        .btn-ghost { font-family: var(--font-tactical); background: transparent; border: 1px solid var(--primary); color: var(--primary); clip-path: none; border-radius: 4px; font-weight: 700; }

        input { width: 100%; background: #000; border: 1px solid var(--secondary); padding: 15px; color: var(--primary); font-family: var(--font-data); font-size: 22px; font-weight: 800; margin-bottom: 15px; outline: none; transition: var(--transition); }
        label { display: block; margin-bottom: 8px; font-size: 10px; color: var(--primary); font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }

        .muscle-header { font-family: var(--font-tactical); background: #0a0a0a; padding: 18px; display: flex; justify-content: space-between; border: 1px solid var(--border); cursor: pointer; margin-bottom: 8px; border-left: 5px solid var(--primary); transition: var(--transition); font-weight: 900; font-size: 14px; letter-spacing: 2px; }
        .muscle-header:active { background: #150000; }
        
        .exercise-list { max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; padding-left: 10px; margin-bottom: 10px; }
        .exercise-list.expanded { max-height: 1000px; opacity: 1; }

        .exercise-item { background: rgba(255, 26, 26, 0.05); padding: 16px; margin-bottom: 6px; display: flex; justify-content: space-between; border-right: 3px solid var(--primary); align-items: center; transform: translateX(-10px); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; }
        .exercise-item b { font-family: var(--font-tactical); font-size: 13px; letter-spacing: 1px; color: #fff; }
        .exercise-list.expanded .exercise-item { transform: translateX(0); opacity: 1; }

        .stat-box { background: #000; padding: 15px; text-align: center; border: 1px solid var(--secondary); }
        .stat-val { font-family: var(--font-data); font-size: 18px; font-weight: 900; color: var(--primary); text-shadow: 0 0 10px rgba(255,26,26,0.5); }
        .stat-lbl { font-family: var(--font-tactical); font-size: 8px; color: var(--text-muted); text-transform: uppercase; font-weight: 900; margin-top: 4px; }

        .muscle-sector { fill: var(--map-cold); transition: fill 1s; stroke: rgba(255,255,255,0.05); stroke-width: 0.4; }
        .muscle-sector.hot { fill: var(--primary); animation: bioPulse 2s infinite; }
        @keyframes bioPulse { 0%, 100% { filter: drop-shadow(0 0 2px var(--primary)); opacity: 1; } 50% { filter: drop-shadow(0 0 10px var(--primary)); opacity: 0.7; } }

        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; padding: 25px; display: flex; justify-content: space-around; border-top: 1px solid var(--border); z-index: 1000; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        .nav-item { font-size: 24px; color: var(--secondary); transition: 0.3s; }
        .nav-item.active { color: var(--primary); filter: drop-shadow(0 0 10px var(--primary)); }

        .neural-log { font-family: var(--font-data); font-size: 11px; color: var(--primary); background: #000; padding: 15px; border: 1px solid var(--secondary); height: 150px; overflow-y: auto; }
        .chart-container { background: #000; border: 1px solid var(--secondary); border-radius: 4px; margin-top: 10px; overflow: hidden; }
    </style>
</head>
<body>

    <div id="aar-overlay" onclick="app.closeAAR()" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; padding: 60px 30px; font-family: var(--font-data); color: var(--primary);">
        <div id="aar-content" style="font-size: 14px; line-height: 1.8;"></div>
        <button class="btn btn-ghost" style="margin-top: 40px; width: 100%;">TERMINATE CONNECTION</button>
    </div>

    <div id="intro-screen" class="screen">
        <div style="text-align: center; margin-top: 8vh; margin-bottom: 50px;">
            <i class="fa-solid fa-radiation" style="font-size: 60px; color: var(--primary); filter: drop-shadow(0 0 20px var(--primary));"></i>
            <h1 style="margin-top:20px; font-size: 32px;">REDLINE</h1>
            <p style="font-size: 9px; letter-spacing: 8px; color: var(--text-muted); font-weight: 900;">NEURAL_LINK_v4.0</p>
        </div>
        <div class="card">
            <label>OPERATOR IDENTITY</label><input type="text" id="setup-name" placeholder="ID_REQUIRED">
            <div style="display: flex; gap: 10px;">
                <div style="flex:1"><label>BASE_MASS</label><input type="number" id="setup-bw" placeholder="lbs"></div>
                <div style="flex:1"><label>PROTO_AGE</label><input type="number" id="setup-age" placeholder="yrs"></div>
            </div>
            <button class="btn" onclick="app.setupUser()">INITIATE PROTOCOL</button>
        </div>
    </div>

    <div id="dashboard-screen" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px;">
            <div><p style="color: var(--primary); font-size: 10px; font-weight: 900; margin-bottom: 5px; letter-spacing: 2px;">CONNECTION: SECURE</p><h1 id="user-name-display" style="font-size: 28px;">...</h1></div>
            <button class="btn-ghost" onclick="app.generateAAR()" style="padding: 8px 15px; font-size: 10px;">EXTRACT</button>
        </div>
        <div id="exercise-container"></div>
    </div>

    <div id="log-screen" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h1 id="log-title" style="font-size: 18px; letter-spacing: 2px;">...</h1>
            <div style="display:flex; gap: 20px;">
                <i class="fa-solid fa-mask" id="blackout-toggle" onclick="app.toggleBlackout()" style="color: var(--secondary); font-size: 20px; cursor: pointer;"></i>
                <i class="fa-solid fa-xmark" onclick="app.nav('dashboard')" style="color: var(--primary); font-size: 24px; cursor: pointer;"></i>
            </div>
        </div>
        
        <div class="card" id="ai-card" style="border-left: 4px solid var(--primary); background: rgba(255,0,0,0.03);">
            <div id="ai-suggestion" style="font-family: var(--font-data); font-size: 12px; font-weight: 800;">CALIBRATING NEURAL LOAD...</div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px;">
            <div class="stat-box"><span class="stat-val" id="last-weight">-</span><span class="stat-lbl">PREV_LOAD</span></div>
            <div class="stat-box"><span class="stat-val" id="last-reps">-</span><span class="stat-lbl">VOL_REPS</span></div>
            <div class="stat-box"><span class="stat-val" id="streak-count">0/2</span><span class="stat-lbl">STREAK</span></div>
        </div>

        <div class="card">
            <label>LOAD_PARAMETER (LBS)</label><input type="number" id="input-weight" inputmode="decimal">
            <label>EXECUTION_VOLUME</label><input type="number" id="input-reps" inputmode="numeric">
            <button class="btn" onclick="app.saveLog()">COMMIT_DATA</button>
        </div>
        <div class="chart-container" style="height: 120px;"><canvas id="chart-canvas"></canvas></div>
    </div>

    <div id="profile-screen" class="screen">
        <h1>ANATOMY_TRACE</h1>
        <div class="map-container" style="display:flex; justify-content:center; gap:20px; margin: 30px 0;">
            <svg viewBox="0 0 100 180" width="130"><circle cx="50" cy="15" r="8" fill="#0a0a0a" stroke="#333" /><path id="map-shoulders" class="muscle-sector" d="M30 30l-12 8 5 15h7v-23z M70 30l12 8-5 15h-7v-23z" /><path id="map-chest" class="muscle-sector" d="M35 32h30l5 18-20 7-20-7z" /><path id="map-arms" class="muscle-sector" d="M18 38l-6 45 6 6 6-51z M82 38l6 45-6 6-6-51z" /><path id="map-core" class="muscle-sector" d="M38 58h24l-3 35h-18z" /><path id="map-legs" class="muscle-sector" d="M35 100l-8 70 18 5 8-75z M65 100l8 70-18 5-8-75z" /></svg>
            <svg viewBox="0 0 100 180" width="130"><circle cx="50" cy="15" r="8" fill="#0a0a0a" stroke="#333" /><path id="map-back" class="muscle-sector" d="M28 32h44l-8 60h-28z" /><path id="map-glutes" class="muscle-sector" d="M33 93h34l3 15h-40z" /></svg>
        </div>

        <div class="card">
            <label>UPDATE_BODY_MASS</label>
            <div style="display:flex; gap:10px;"><input type="number" id="input-bw-update" style="margin-bottom:0;"><button class="btn" style="width:70px; padding:0;" onclick="app.updateBodyWeight()"><i class="fa-solid fa-plus"></i></button></div>
        </div>

        <div class="chart-container" style="height:150px; margin-bottom: 25px;"><canvas id="bw-chart-canvas"></canvas></div>

        <div id="stat-rank-display" style="font-size: 38px; font-weight: 900; color: var(--primary); letter-spacing: 6px; text-align: center; margin-bottom: 20px; text-shadow: 0 0 20px var(--primary);">---</div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
            <div class="stat-box"><span class="stat-val" id="stat-total-vol">0</span><span class="stat-lbl">TOTAL_LBS</span></div>
            <div class="stat-box"><span class="stat-val" id="stat-prs">0</span><span class="stat-lbl">RECORDS</span></div>
            <div class="stat-box"><span class="stat-val" id="stat-current-bw">-</span><span class="stat-lbl">MASS_LBS</span></div>
        </div>

        <h2>NEURAL_HISTORY_LOG</h2>
        <div class="neural-log" id="neural-history"></div>
        <button class="btn btn-ghost" onclick="app.resetAll()" style="margin-top:30px; border-color: #222; color: #444;">WIPE_LOCAL_CORE</button>
    </div>

    <nav id="main-nav" class="nav hidden">
        <div class="nav-item active" onclick="app.nav('dashboard')"><i class="fa-solid fa-microchip"></i></div>
        <div class="nav-item" onclick="app.nav('profile')"><i class="fa-solid fa-dna"></i></div>
    </nav>

    <script>
        const DB_KEY = 'redline_protocol_vFinal';
        const EXERCISES = {
            "Chest": ["Incline Dumbbell Bench", "Chest Fly"],
            "Back": ["Wide-grip Pull-ups", "Underhand Chin-ups", "Shrugs"],
            "Shoulders": ["Lateral Raises", "Reverse Fly"],
            "Legs": ["Leg Extensions", "Leg Curls", "RDL", "Calf Raises"],
            "Arms": ["JM Press", "Pushdowns", "Preacher Curl", "Hammer Curl", "Reverse Curls"],
            "Core": ["Weighted Sit-ups"]
        };
        const COEFFS = { "Incline Dumbbell Bench": 0.8, "Chest Fly": 0.45, "Wide-grip Pull-ups": 1.0, "Underhand Chin-ups": 1.05, "Shrugs": 1.1, "Lateral Raises": 0.25, "Reverse Fly": 0.25, "Leg Extensions": 0.7, "Leg Curls": 0.6, "RDL": 1.3, "Calf Raises": 0.9, "JM Press": 0.55, "Pushdowns": 0.45, "Preacher Curl": 0.4, "Hammer Curl": 0.4, "Reverse Curls": 0.35, "Weighted Sit-ups": 0.5 };

        const app = {
            data: { user: null, logs: {}, prs: {}, lastRank: "Novice", eventLog: [], totalVolume: 0, lastTrain: {}, currentSessionEx: [], bwHistory: [] },
            charts: {},

            init() {
                const stored = localStorage.getItem(DB_KEY);
                if (stored) {
                    this.data = JSON.parse(stored);
                    if (this.data.user) return this.nav('dashboard');
                }
                this.nav('intro');
            },

            logEvent(msg) {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                this.data.eventLog.unshift(`[${time}] >> ${msg.toUpperCase()}`);
                if(this.data.eventLog.length > 30) this.data.eventLog.pop();
            },

            nav(screen) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(`${screen}-screen`).classList.add('active');
                document.getElementById('main-nav').classList.toggle('hidden', screen === 'intro' || screen === 'log');
                if(screen === 'dashboard') this.renderDashboard();
                if(screen === 'profile') this.renderProfile();
                document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', (screen==='dashboard'&&i===0)||(screen==='profile'&&i===1)));
            },

            setupUser() {
                const n = document.getElementById('setup-name').value;
                const bw = parseFloat(document.getElementById('setup-bw').value);
                if (!n || !bw) return;
                this.data.user = { name: n, currentWeight: bw };
                this.data.bwHistory.push({ weight: bw, date: new Date().toISOString() });
                this.save(); this.nav('dashboard');
            },

            updateBodyWeight() {
                const bw = parseFloat(document.getElementById('input-bw-update').value);
                if (!bw) return;
                this.data.user.currentWeight = bw;
                this.data.bwHistory.push({ weight: bw, date: new Date().toISOString() });
                this.logEvent(`Mass re-linked: ${bw}lbs`);
                this.save(); this.renderProfile();
            },

            toggleBlackout() {
                document.body.classList.toggle('blackout-active');
                document.getElementById('blackout-toggle').style.color = document.body.classList.contains('blackout-active') ? 'var(--primary)' : 'var(--secondary)';
            },

            generateAAR() {
                const overlay = document.getElementById('aar-overlay');
                overlay.style.display = 'block';
                const content = document.getElementById('aar-content');
                content.innerHTML = '';
                let totalAvail = 0; Object.values(EXERCISES).forEach(c => totalAvail += c.length);
                const lines = [
                    "--- REDLINE_SESSION_EXTRACT ---",
                    `OPERATOR: ${this.data.user.name}`,
                    `SECTOR_COMPLETION: ${this.data.currentSessionEx.length} / ${totalAvail}`,
                    `VOLUME_MOVED: ${Math.floor(this.data.totalVolume).toLocaleString()} LBS`,
                    `RANK: ${this.data.lastRank.toUpperCase()}`,
                    "--- END_OF_TRANSMISSION ---"
                ];
                lines.forEach((t, i) => setTimeout(() => {
                    const div = document.createElement('div'); div.innerText = t; content.appendChild(div);
                }, i * 200));
            },

            closeAAR() { this.data.currentSessionEx = []; this.save(); document.getElementById('aar-overlay').style.display = 'none'; },

            renderDashboard() {
                document.getElementById('user-name-display').innerText = this.data.user.name;
                const container = document.getElementById('exercise-container');
                container.innerHTML = Object.keys(EXERCISES).map(muscle => {
                    const exHtml = EXERCISES[muscle].map((ex, idx) => {
                        const logs = this.data.logs[ex] || [];
                        const last = logs[logs.length-1];
                        return `<div class="exercise-item" style="transition-delay: ${idx * 40}ms" onclick="app.openLog('${ex}', '${muscle}')">
                                    <div><b>${ex.toUpperCase()}</b><div style="font-family:var(--font-data); font-size:10px; color:var(--text-muted); margin-top:4px;">${last ? last.weight+'LB x '+last.reps : 'NO_TRACE'}</div></div>
                                    <i class="fa-solid fa-chevron-right" style="color:var(--primary); font-size:12px; opacity:0.5;"></i>
                                </div>`;
                    }).join('');
                    return `<div>
                        <div class="muscle-header" onclick="app.toggle(this)"><span>${muscle.toUpperCase()}</span><i class="fa-solid fa-plus" style="font-size:10px"></i></div>
                        <div class="exercise-list">${exHtml}</div>
                    </div>`;
                }).join('');
            },

            toggle(el) { 
                const list = el.nextElementSibling;
                list.classList.toggle('expanded');
                el.querySelector('i').className = list.classList.contains('expanded') ? 'fa-solid fa-minus' : 'fa-solid fa-plus';
            },

            openLog(ex, muscle) {
                this.activeEx = ex; this.activeMuscle = muscle;
                document.getElementById('log-title').innerText = ex.toUpperCase();
                const logs = this.data.logs[ex] || [];
                const last = logs[logs.length-1];
                document.getElementById('last-weight').innerText = last ? last.weight : '0';
                document.getElementById('last-reps').innerText = last ? last.reps : '0';
                document.getElementById('input-weight').value = last ? last.weight : '';
                document.getElementById('streak-count').innerText = `${this.calcStreak(logs)}/2`;
                this.nav('log');
                setTimeout(() => this.renderChart('chart-canvas', logs.map(l => l.weight)), 100);
            },

            saveLog() {
                const w = parseFloat(document.getElementById('input-weight').value);
                const r = parseInt(document.getElementById('input-reps').value);
                if(!w || !r) return;
                if(!this.data.logs[this.activeEx]) this.data.logs[this.activeEx] = [];
                this.data.logs[this.activeEx].push({ weight: w, reps: r, date: new Date().toISOString() });
                this.data.totalVolume += (w * r);
                if (!this.data.currentSessionEx.includes(this.activeEx)) this.data.currentSessionEx.push(this.activeEx);
                this.data.lastTrain[this.activeMuscle.toLowerCase()] = Date.now();
                if(w > (this.data.prs[this.activeEx] || 0)) { this.data.prs[this.activeEx] = w; this.logEvent(`PR_BREACH: ${this.activeEx}`); this.checkRank(this.activeEx, w); }
                this.save(); this.nav('dashboard');
            },

            calcStreak(logs) {
                let s = 0; for(let i = logs.length-1; i >= 0; i--) { if(logs[i].reps >= 8) { s++; if(s===2) break; } else break; } return s;
            },

            checkRank(ex, w) {
                const ratio = (w / (this.data.user.currentWeight * (COEFFS[ex] || 0.5)));
                let rank = "Novice";
                if(ratio >= 1.6) rank = "Elite"; else if(ratio >= 1.1) rank = "Advanced"; else if(ratio >= 0.7) rank = "Intermediate";
                if(rank !== this.data.lastRank) { this.data.lastRank = rank; this.logEvent(`RANK_UP: ${rank}`); confetti({ colors: ['#ff0000'] }); }
            },

            renderProfile() {
                document.getElementById('stat-total-vol').innerText = Math.floor(this.data.totalVolume).toLocaleString();
                document.getElementById('stat-prs').innerText = Object.keys(this.data.prs).length;
                document.getElementById('stat-current-bw').innerText = this.data.user.currentWeight;
                document.getElementById('stat-rank-display').innerText = this.data.lastRank.toUpperCase();
                document.getElementById('neural-history').innerHTML = this.data.eventLog.map(e => `<div style="margin-bottom:8px; border-left:2px solid var(--secondary); padding-left:10px;">${e}</div>`).join('');
                this.renderChart('bw-chart-canvas', this.data.bwHistory.map(h => h.weight));
                const now = Date.now();
                ['chest', 'back', 'shoulders', 'legs', 'arms', 'core', 'glutes'].forEach(g => {
                    const el = document.getElementById(`map-${g}`);
                    if(el) el.classList.toggle('hot', (now - (this.data.lastTrain[g] || 0)) / 3600000 < 24 && this.data.lastTrain[g] > 0);
                });
            },

            renderChart(id, data) {
                if(this.charts[id]) this.charts[id].destroy();
                const ctx = document.getElementById(id); if(!ctx) return;
                this.charts[id] = new Chart(ctx, {
                    type: 'line',
                    data: { labels: data.map(() => ''), datasets: [{ data: data.slice(-10), borderColor: '#ff1a1a', backgroundColor: 'rgba(255,26,26,0.1)', fill: true, tension: 0.4, pointRadius: 4, borderWidth: 3 }] },
                    options: { maintainAspectRatio: false, plugins: { legend: { display: false }}, scales: { x: { display: false }, y: { grid: { color: 'rgba(255,26,26,0.1)' }, ticks: { color: '#666', font: { family: 'JetBrains Mono', size: 10 } } } } }
                });
            },

            save() { localStorage.setItem(DB_KEY, JSON.stringify(this.data)); },
            resetAll() { if(confirm("INITIATE TOTAL DATA WIPE?")) { localStorage.clear(); location.reload(); } }
        };

        window.onload = () => app.init();
    </script>
</body></html>
